name = "twine-feedback"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# GITHUB_TOKEN is a secret: npx wrangler secret put GITHUB_TOKEN
# Fine-grained token, repository "twine" only, Issues: read and write.

[vars]
GITHUB_REPO = "EngineeringMoonBear/twine"
ALLOWED_ORIGINS = "https://twine.joshedunbar.com,http://twine.joshedunbar.com"

# 5 notes per minute per IP.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
