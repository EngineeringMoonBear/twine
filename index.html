<title>Twine</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: a single phone-shaped app column (centered on desktop, edge to edge on phones) with a bottom tab bar; sheets slide over it. */
:root {
  --bg: #f6f1f4;          /* page ground, rose-biased neutral */
  --surface: #fffafc;     /* app surface */
  --raised: #ffffff;
  --ink: #2a1730;         /* aubergine ink */
  --muted: #76627c;
  --line: #e6d9e2;
  --rose: #c9386e;        /* strand one: rose */
  --rose-soft: #fbe3ec;
  --teal: #12807a;        /* strand two: teal */
  --teal-soft: #d9f1ee;
  --gold: #a8710c;
  --live: #e0244f;
  --shadow: 0 10px 30px -12px rgba(42, 23, 48, .35);
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "Instrument Sans", "Helvetica Neue", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #140d18; --surface: #1c1321; --raised: #261a2c; --ink: #f6e9f0; --muted: #b29bb8;
    --line: #3a2a41; --rose: #ff6f9f; --rose-soft: #3d1a2a; --teal: #4fd1c5; --teal-soft: #113532;
    --gold: #f0b54a; --live: #ff4a6e; --shadow: 0 10px 30px -12px rgba(0,0,0,.7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #140d18; --surface: #1c1321; --raised: #261a2c; --ink: #f6e9f0; --muted: #b29bb8;
  --line: #3a2a41; --rose: #ff6f9f; --rose-soft: #3d1a2a; --teal: #4fd1c5; --teal-soft: #113532;
  --gold: #f0b54a; --live: #ff4a6e; --shadow: 0 10px 30px -12px rgba(0,0,0,.7); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  display: flex; justify-content: center; align-items: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
.mono { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }

.app {
  position: relative; width: 100%; max-width: 420px; height: min(860px, 100%);
  background: var(--surface); border: 1px solid var(--line); border-radius: 28px; overflow: hidden;
  display: flex; flex-direction: column; box-shadow: var(--shadow);
}
@media (max-width: 460px) {
  body { padding: 0; }
  .app { max-width: none; height: 100%; border-radius: 0; border: 0; }
}

/* header */
.top { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 10px; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; }
.brand h1 { font-size: 26px; font-weight: 800; }
.strands { width: 30px; height: 30px; }
.intent { display: flex; background: var(--raised); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.intent button { border: 0; background: none; border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 600; color: var(--muted); }
.intent button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

main { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; }
.view { padding: 4px 18px 24px; display: flex; flex-direction: column; gap: 14px; }
.view[hidden] { display: none !important; }
.sample-note { font-size: 12px; color: var(--muted); }

/* tab bar */
nav.tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: var(--surface); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs button { border: 0; background: none; padding: 9px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; color: var(--muted); position: relative; }
nav.tabs button svg { width: 22px; height: 22px; }
nav.tabs button[aria-selected="true"] { color: var(--rose); }
nav.tabs .badge { position: absolute; top: 5px; right: calc(50% - 18px); background: var(--live); color: #fff; font-size: 10px; border-radius: 999px; padding: 0 5px; line-height: 16px; }

/* avatars: generated, no photos in the sample */
.av { border-radius: 18px; position: relative; overflow: hidden; display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-weight: 800; }
.av.fill { height: 100%; }
.av span { font-size: 64px; opacity: .9; text-shadow: 0 2px 20px rgba(0,0,0,.2); }

/* MEET: card deck */
.deck { position: relative; height: 470px; margin-top: 4px; }
.card {
  position: absolute; inset: 0; border-radius: 24px; overflow: hidden; background: var(--raised);
  border: 1px solid var(--line); box-shadow: var(--shadow); touch-action: none; user-select: none;
  transition: transform .3s ease, opacity .3s ease; display: flex; flex-direction: column;
}
.card.dragging { transition: none; }
.card .av { flex: 1; border-radius: 0; }
.card .info { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; }
.card .name { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.card .name h2 { font-size: 26px; }
.pron { font-size: 13px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--rose-soft); color: var(--rose); }
.chip.t { background: var(--teal-soft); color: var(--teal); }
.chip.g { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.verified { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--teal); font-weight: 600; }
.stamp { position: absolute; top: 22px; padding: 6px 12px; border: 3px solid; border-radius: 10px; font-family: var(--font-display); font-weight: 800; font-size: 24px; opacity: 0; transform: rotate(-12deg); background: rgba(255,255,255,.85); }
.stamp.wave { left: 18px; color: var(--teal); }
.stamp.pass { right: 18px; color: var(--muted); transform: rotate(12deg); }
.stamp.spark { left: 50%; top: 40%; transform: translateX(-50%) rotate(-6deg); color: var(--rose); }
.prompt { font-size: 14px; }
.prompt b { display: block; font-size: 11px; color: var(--muted); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
.actions { display: flex; justify-content: center; gap: 18px; }
.act { width: 58px; height: 58px; border-radius: 50%; border: 1px solid var(--line); background: var(--raised); display: grid; place-items: center; box-shadow: var(--shadow); transition: transform .15s; }
.act:active { transform: scale(.92); }
.act svg { width: 26px; height: 26px; }
.act.pass { color: var(--muted); }
.act.wave { color: var(--teal); }
.act.spark { color: var(--rose); width: 66px; height: 66px; }
.act-labels { display: flex; justify-content: center; gap: 18px; margin-top: -8px; }
.act-labels span { width: 58px; text-align: center; font-size: 11px; color: var(--muted); }
.act-labels span:nth-child(3) { width: 66px; }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }

/* NEARBY grid */
.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filters button { flex: none; border: 1px solid var(--line); background: var(--raised); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.tile { border: 0; padding: 0; background: none; text-align: left; position: relative; aspect-ratio: 3/4; max-width: 100%; border-radius: 14px; overflow: hidden; }
.tile .av { position: absolute; inset: 0; border-radius: 0; }
.tile .av span { font-size: 36px; }
.tile .meta { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 6px; background: linear-gradient(transparent, rgba(20,8,24,.75)); color: #fff; font-size: 12px; font-weight: 600; }
.tile .meta small { display: block; font-weight: 400; opacity: .85; font-size: 11px; }
.dot { position: absolute; top: 7px; left: 7px; width: 10px; height: 10px; border-radius: 50%; background: #3ad38a; border: 2px solid #fff; }
.tile .live-pill { position: absolute; top: 6px; right: 6px; }
.privacy-line { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: var(--muted); background: var(--raised); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.privacy-line svg { flex: none; width: 16px; height: 16px; color: var(--teal); margin-top: 1px; }

/* LIVE rooms */
.live-pill { display: inline-flex; align-items: center; gap: 4px; background: var(--live); color: #fff; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 6px; letter-spacing: .05em; }
.room { border: 1px solid var(--line); background: var(--raised); border-radius: 18px; overflow: hidden; text-align: left; padding: 0; display: flex; flex-direction: column; width: 100%; }
.room .stage { aspect-ratio: 16/9; max-width: 100%; position: relative; }
.room .stage .live-pill { position: absolute; top: 10px; left: 10px; }
.room .stage .viewers { position: absolute; top: 10px; right: 10px; background: rgba(20,8,24,.6); color: #fff; font-size: 11px; padding: 2px 7px; border-radius: 6px; font-family: var(--font-mono); }
.room .stage .host { position: absolute; left: 12px; bottom: 10px; color: #fff; font-family: var(--font-display); font-weight: 700; font-size: 18px; text-shadow: 0 2px 10px rgba(0,0,0,.3); }
.room .body { padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 6px; }
.room h3 { font-size: 17px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.section-head h2 { font-size: 20px; }
.section-head span { font-size: 12px; color: var(--muted); }
.stage-anim { background-size: 200% 200%; animation: drift 8s ease-in-out infinite alternate; }
@keyframes drift { from { background-position: 0% 30%; } to { background-position: 100% 70%; } }

/* EVENTS */
.event { display: grid; grid-template-columns: 58px 1fr; gap: 12px; border: 1px solid var(--line); background: var(--raised); border-radius: 18px; padding: 12px; }
.date { border-radius: 12px; text-align: center; padding: 6px 0; background: var(--rose-soft); color: var(--rose); align-self: start; }
.date.t { background: var(--teal-soft); color: var(--teal); }
.date b { display: block; font-family: var(--font-display); font-size: 24px; line-height: 1; }
.date small { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; }
.event .body { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.event h3 { font-size: 17px; }
.event .where { font-size: 13px; color: var(--muted); }
.event .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.going { font-size: 12px; color: var(--muted); }
.btn { border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 13px; background: var(--ink); color: var(--surface); }
.btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
.btn.rose { background: var(--rose); color: #fff; }
.btn[aria-pressed="true"] { background: var(--teal); color: #fff; }
.toggle-row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.toggle-row input { accent-color: var(--teal); }

/* CHATS */
.thread { display: flex; gap: 12px; align-items: center; padding: 10px 0; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; width: 100%; }
.thread .av { width: 52px; height: 52px; flex: none; border-radius: 16px; }
.thread .av span { font-size: 22px; }
.thread .txt { min-width: 0; flex: 1; }
.thread .txt b { display: block; }
.thread .txt p { margin: 0; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thread .when { font-size: 11px; color: var(--muted); font-family: var(--font-mono); }

/* SHEETS (overlays inside the phone) */
.sheet { position: absolute; inset: 0; background: var(--surface); z-index: 20; display: flex; flex-direction: column; animation: up .28s ease; }
@keyframes up { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.sheet-head h2 { font-size: 18px; flex: 1; min-width: 0; }
.icon-btn { border: 0; background: var(--raised); border: 1px solid var(--line); width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.icon-btn svg { width: 18px; height: 18px; }
.sheet-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

/* live room sheet */
.room-stage { aspect-ratio: 16/9; max-width: 100%; position: relative; flex: none; }
.room-stage .live-pill { position: absolute; top: 10px; left: 10px; }
.floaters { position: absolute; right: 14px; bottom: 10px; width: 40px; height: 100%; pointer-events: none; }
.floaters span { position: absolute; bottom: 0; font-size: 22px; animation: rise 2.2s ease-out forwards; }
@keyframes rise { to { transform: translateY(-160px); opacity: 0; } }
.chatlog { flex: 1; overflow-y: auto; padding: 10px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.msg b { margin-right: 6px; }
.msg .mod { font-family: var(--font-mono); font-size: 9px; background: var(--teal); color: #fff; padding: 1px 4px; border-radius: 4px; margin-right: 4px; vertical-align: 2px; }
.msg.sys { color: var(--muted); font-size: 12px; font-style: italic; }
.composer { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); align-items: center; padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)); }
.composer input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--raised); border-radius: 999px; padding: 9px 14px; font: inherit; color: var(--ink); }
.react-row { display: flex; gap: 6px; padding: 8px 12px 0; }
.react-row button { border: 1px solid var(--line); background: var(--raised); border-radius: 999px; padding: 4px 10px; font-size: 16px; }

/* dm */
.bubble { max-width: 78%; padding: 9px 13px; border-radius: 18px; font-size: 14px; }
.bubble.them { background: var(--raised); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 6px; }
.bubble.me { background: var(--rose); color: #fff; align-self: flex-end; border-bottom-right-radius: 6px; }
.safety-card { border: 1px dashed var(--teal); border-radius: 14px; padding: 12px; background: var(--teal-soft); display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
.safety-card h3 { font-size: 15px; color: var(--teal); }

/* pledge */
.pledge { background: var(--surface); }
.pledge .sheet-body { gap: 16px; padding: 24px 22px; }
.pledge h2.big { font-size: 34px; font-weight: 800; line-height: 1.05; }
.pledge ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; }
.pledge li::marker { font-family: var(--font-display); font-weight: 800; color: var(--rose); }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.check input { margin-top: 3px; accent-color: var(--rose); width: 18px; height: 18px; flex: none; }

/* match modal */
.match { position: absolute; inset: 0; z-index: 30; background: rgba(20,8,24,.82); display: grid; place-items: center; padding: 24px; animation: up .3s ease; }
.match-card { background: var(--surface); border-radius: 24px; padding: 24px; text-align: center; display: flex; flex-direction: column; gap: 14px; width: 100%; }
.match-card h2 { font-size: 30px; font-weight: 800; }
.pair { display: flex; justify-content: center; }
.pair .av { width: 90px; height: 90px; border-radius: 50%; border: 4px solid var(--surface); }
.pair .av span { font-size: 36px; }
.pair .av + .av { margin-left: -18px; }

.toast { position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 999px; font-size: 13px; z-index: 40; white-space: nowrap; animation: up .2s ease; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

/* ---------- moderation console ---------- */
/* Mod mode: dark header band, severity pills, category highlights on flagged text, editable fixes. */
:root {
  --mod-band: #2a1730; --mod-band-ink: #fff4f8;
  --sev-high: #c4262e; --sev-high-soft: #fde4e4;
  --sev-med: #a35f00; --sev-med-soft: #fdf0d9;
  --sev-low: #3f6489; --sev-low-soft: #e3ecf5;
  --hl-dating: #ffd3e3; --hl-invasive: #ffe0b0; --hl-fetish: #efcbff; --hl-misgender: #cfe5ff; --hl-ink: #2a1730;
  --fetish: #8a3cc2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --mod-band: #0b070d; --mod-band-ink: #f6e9f0;
    --sev-high: #ff7a7a; --sev-high-soft: #3d1717; --sev-med: #f0b54a; --sev-med-soft: #3a2a10; --sev-low: #8fb4dc; --sev-low-soft: #1a2633;
    --hl-dating: #6b2442; --hl-invasive: #5c3a12; --hl-fetish: #4e2465; --hl-misgender: #1d3d5e; --hl-ink: #fff4f8; --fetish: #d79bff;
  }
}
:root[data-theme="dark"] {
  --mod-band: #0b070d; --mod-band-ink: #f6e9f0;
  --sev-high: #ff7a7a; --sev-high-soft: #3d1717; --sev-med: #f0b54a; --sev-med-soft: #3a2a10; --sev-low: #8fb4dc; --sev-low-soft: #1a2633;
  --hl-dating: #6b2442; --hl-invasive: #5c3a12; --hl-fetish: #4e2465; --hl-misgender: #1d3d5e; --hl-ink: #fff4f8; --fetish: #d79bff;
}

.app.mod .top { background: var(--mod-band); color: var(--mod-band-ink); padding-bottom: 14px; }
.app.mod .intent { background: transparent; border-color: color-mix(in srgb, var(--mod-band-ink) 30%, transparent); }
.app.mod .intent button { color: color-mix(in srgb, var(--mod-band-ink) 70%, transparent); }
.app.mod .intent button[aria-pressed="true"] { background: var(--mod-band-ink); color: var(--mod-band); }
.app.mod nav.tabs button[aria-selected="true"] { color: var(--teal); }
.app.mod main .view { padding-top: 14px; }
.modpill { font-family: var(--font-mono); font-size: 10px; letter-spacing: .08em; text-transform: uppercase; background: var(--teal); color: #fff; padding: 2px 6px; border-radius: 5px; }

mark.hl { color: var(--hl-ink); border-radius: 4px; padding: 0 2px; border-bottom: 2px solid; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.hl-dating { background: var(--hl-dating); border-color: var(--rose); }
.hl-invasive { background: var(--hl-invasive); border-color: var(--gold); }
.hl-fetish { background: var(--hl-fetish); border-color: var(--fetish); }
.hl-misgender { background: var(--hl-misgender); border-color: var(--sev-low); }
.chip.c-dating { background: var(--hl-dating); color: var(--hl-ink); }
.chip.c-invasive { background: var(--hl-invasive); color: var(--hl-ink); }
.chip.c-fetish { background: var(--hl-fetish); color: var(--hl-ink); }
.chip.c-misgender { background: var(--hl-misgender); color: var(--hl-ink); }
.chip.c-other { background: transparent; border: 1px solid var(--line); color: var(--muted); }

.sev { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; padding: 3px 7px; border-radius: 6px; font-weight: 500; }
.sev.high { background: var(--sev-high-soft); color: var(--sev-high); }
.sev.med { background: var(--sev-med-soft); color: var(--sev-med); }
.sev.low { background: var(--sev-low-soft); color: var(--sev-low); }
.sev.done { background: var(--teal-soft); color: var(--teal); }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); background: var(--raised); border-radius: 16px; }
.stats div { padding: 10px 12px; min-width: 0; }
.stats div + div { border-left: 1px solid var(--line); }
.stats b { display: block; font-family: var(--font-display); font-size: 26px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stats b.alert { color: var(--sev-high); }
.stats small { font-size: 11px; color: var(--muted); }

.case-list { display: flex; flex-direction: column; gap: 10px; }
.case { display: flex; flex-direction: column; gap: 8px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--raised); border-radius: 16px; padding: 12px 14px; }
.case:hover { border-color: var(--muted); }
.case.closed { opacity: .65; }
.case-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.case-text { display: block; font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; }
.case-foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.case-foot .claimed { color: var(--teal); font-weight: 600; }

.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); align-items: center; }
.legend mark { font-size: 12px; }

function topCard() { return [...document.querySelectorAll("#deck .card")].pop(); }

function attachDrag() {
  const card = topCard(); if (!card) return;
  let sx = 0, dx = 0, on = false;
  const stamp = cls => card.querySelector(".stamp." + cls);
  card.addEventListener("pointerdown", e => { on = true; sx = e.clientX; dx = 0; card.setPointerCapture(e.pointerId); card.classList.add("dragging"); });
  card.addEventListener("pointermove", e => {
    if (!on) return;
    dx = e.clientX - sx;
    card.style.transform = `translate(${dx}px, 0) rotate(${dx / 18}deg)`;
    stamp("wave").style.opacity = Math.max(0, dx / 100);
    stamp("pass").style.opacity = Math.max(0, -dx / 100);
  });
  card.addEventListener("pointerup", () => {
    if (!on) return; on = false; card.classList.remove("dragging");
    if (dx > 110) return decide("wave");
    if (dx < -110) return decide("pass");
    card.style.transform = ""; card.querySelectorAll(".stamp").forEach(s => s.style.opacity = 0);
  });
}

function decide(kind) {
  const card = topCard(); if (!card) return;
  const p = byId(+card.dataset.id);
  card.style.transform = kind === "pass" ? "translate(-140%, 20px) rotate(-20deg)" : "translate(140%, 20px) rotate(20deg)";
  card.style.opacity = 0;
  state.seen.add(p.id);
  setTimeout(() => {
    renderMeet();
    // In the prototype, a wave is mutual when the id is odd.
    if (kind === "wave" && p.id % 2) showMatch(p);
  }, 280);
}

const BAD_LINES = ["you're so cute, are you single? 😉", "wait are you pre-op?", "dude your setup is sick"];
let roomTimer = null;
function openRoom(r) {
  const i = rooms.indexOf(r);

  s.insertAdjacentHTML("beforeend", `

    if (!document.body.contains(chat)) return clearInterval(roomTimer);
    const [who, mod] = CHATTERS[Math.floor(Math.random() * CHATTERS.length)];
    const pool = !mod && Math.random() < .18 ? BAD_LINES : LINES;
    add(who, pool[Math.floor(Math.random() * pool.length)], !!mod);

function recommend(c) {
  if (c.cat === "fetish" || c.strikes >= 2) return ["remove", c.cat === "fetish" ? "Fetishizing is an immediate removal." : "Third strike."];

  return ["hide", "First strike. Hide it and send a warning."];

  const r = FLAG_CATS[c.cat].rule;

  const why = c.cat === "dating" ? "Twine is a friendship space, so advances like this aren't allowed"
    : `It breaks pledge rule ${r}: ${RULES[r - 1]}`;
  return `Hi ${c.who}, a mod reviewed something you posted (${c.where.toLowerCase()}). ${why}. ${what}. ${action === "remove" ? "" : "If you think we got this wrong, reply here and a different mod will look."}`.trim();
}

function openCase(c) {
  const closed = c.status !== "open";
  const [rec, recWhy] = recommend(c);
  const editable = isEditable(c);
  const cats = [...new Set(findFlags(c.text).map(h => h.cat))];
  const r = FLAG_CATS[c.cat].rule;
  const s = sheet(`Case ${c.id}`, `
    <div class="case-top">${closed ? `<span class="sev done">${DONE_LABEL[c.status]}</span>` : `<span class="sev ${c.sev}">${SEV[c.sev]}</span>`}<span class="chip c-${c.cat}">${FLAG_CATS[c.cat].label}</span></div>
    <dl class="kv">
      <dt>Member</dt><dd>${esc(c.who)} · ${c.strikes ? `${c.strikes} prior strike${c.strikes > 1 ? "s" : ""}` : "no prior strikes"}</dd>
      <dt>Where</dt><dd>${esc(c.where)}</dd>
      <dt>Source</dt><dd>${c.source === "Report" ? `Report from ${esc(c.by)}` : "Twine filter"} · ${c.age ? `${fmtAge(c.age)} ago` : "just now"}</dd>
      <dt>Rule</dt><dd>${r}. ${esc(RULES[r - 1])}</dd>
    </dl>
    <span class="mono" style="color:var(--muted)">Flagged content</span>
    <div class="quote">${highlight(c.text)}</div>
    ${cats.length ? legendHTML(cats) : `<p class="sample-note">The filter didn't catch anything here. Read the report and use your judgment.</p>`}
    ${closed ? `<div class="rec">${DONE_LABEL[c.status]} by <b>${esc(c.resolvedBy)}</b>${c.fixed ? `. New text: “${esc(c.fixed)}”` : ""}</div>` : `
    <div class="rec">Suggested: <b>${ACTIONS[rec]}</b>. ${recWhy}</div>
    <button class="btn ghost" id="cs-claim">${c.claimed === "You" ? "Claimed by you" : c.claimed ? `Take over from ${esc(c.claimed)}` : "Claim this case"}</button>
    ${editable ? `
    <div class="field"><label for="cs-fix">Fixed version</label>
      <textarea id="cs-fix">${esc(c.fix ?? stripFlags(c.text))}</textarea>
      <div class="fixcheck" id="cs-fixcheck" aria-live="polite"></div></div>` : ""}
    <div class="field"><label for="cs-warn">Message to ${esc(c.who)}</label><textarea id="cs-warn">${esc(warnText(c, rec))}</textarea></div>
    <div class="field"><label for="cs-note">Note for the team</label><input id="cs-note" placeholder="Only mods see this"></div>
    <hr class="divider">
    <div class="action-grid">
      ${editable ? `<button class="btn teal" data-act="fix">Apply fix</button>` : `<button class="btn teal" data-act="hide">Hide content</button>`}
      <button class="btn" data-act="warn">Send warning</button>
      <button class="btn ghost" data-act="mute">Mute 7 days</button>
      <button class="btn danger" data-act="remove">Remove from Twine</button>
    </div>
    <button class="btn ghost" data-act="dismiss">Dismiss, no rule broken</button>`}`);
  if (closed) return;
  const fix = s.querySelector("#cs-fix"), check = s.querySelector("#cs-fixcheck"), warn = s.querySelector("#cs-warn");
  const recheck = () => {
    if (!fix) return;
    const left = findFlags(fix.value);
    check.className = "fixcheck " + (left.length ? "bad" : "ok");
    check.innerHTML = left.length ? `Still flagged: <span>${highlight(fix.value)}</span>` : "Clean. Nothing left for the filter to flag.";
  };
  fix && (fix.oninput = recheck); recheck();
  s.querySelector("#cs-claim").onclick = e => { c.claimed = "You"; e.target.textContent = "Claimed by you"; toast(`You claimed ${c.id}.`); };
  s.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const act = b.dataset.act;
    if (act === "fix" && findFlags(fix.value).length && !b.dataset.ok) { b.dataset.ok = "1"; b.textContent = "Still flagged. Apply anyway?"; return; }
    if (act === "remove" && !b.classList.contains("armed")) { b.classList.add("armed"); b.textContent = "Tap again to remove"; return; }
    resolve(c, act, { fixed: fix?.value.trim(), note: s.querySelector("#cs-note").value.trim() });
    s.remove();
  });
  // Keep the member message in step with the action a mod hovers toward.
  s.querySelectorAll("[data-act]").forEach(b => b.addEventListener("pointerenter", () => {
    if (!warn.dataset.touched && b.dataset.act !== "dismiss") warn.value = warnText(c, b.dataset.act);
  }));
  warn.oninput = () => warn.dataset.touched = "1";
}

function resolve(c, act, { fixed, note }) {
  c.status = act; c.resolvedBy = "You"; c.claimed = "You";
  if (act === "fix") c.fixed = fixed;
  const r = FLAG_CATS[c.cat].rule;
  const what = {
    fix: `Applied a fix to ${c.who}'s ${c.where.toLowerCase()} and sent a warning`,
    hide: `Hid ${c.who}'s content (${c.where}) and sent a warning`,
    warn: `Warned ${c.who} (rule ${r})`,
    mute: `Muted ${c.who} for 7 days (rule ${r})`,
    remove: `Removed ${c.who} from Twine (rule ${r})`,
    dismiss: `Dismissed a report on ${c.who}: no rule broken`,
  }[act];
  addLog(what + (note ? `. Note: ${note}` : ""), c.id);
  toast(`${c.id} ${DONE_LABEL[act].toLowerCase()}.`);
  show("queue");
}

// ---------- MOD: live rooms ----------
function renderModLive() {
  const v = $("#view-modlive");
  v.innerHTML = `
    <div class="section-head"><h2>Room watch</h2><span>Flags in the last hour</span></div>
    <div class="panel">${rooms.map(r => {
      const pct = Math.min(100, r.flags * 15), heat = r.flags >= 5 ? "hot" : r.flags >= 3 ? "warm" : "";
      const thin = r.viewers / r.mods > 100;
      return `<div class="room-row">
        <div class="line"><div><b>${esc(r.title)}</b><small>${r.viewers} watching · ${r.mods} mod${r.mods > 1 ? "s" : ""} in room${thin ? ` · <span style="color:var(--sev-high);font-weight:600">needs another mod</span>` : ""}</small></div>
          <button class="btn ghost" data-watch="${r.id}">Watch</button></div>
        <div class="meter" aria-label="${r.flags} flags this hour"><i class="${heat}" style="width:${pct}%"></i></div>
      </div>`;
    }).join("")}</div>
    <div class="section-head"><h2>Held messages</h2><span>${held.length} waiting</span></div>
    <div class="panel">${held.length ? held.map(h => `
      <div class="held">
        <span class="who">${esc(h.who)} in ${esc(rooms.find(r => r.id === h.room).title)}</span>
        <span class="case-text">${highlight(h.text)}</span>
        ${h.hint ? `<span class="hint">${esc(h.hint)}</span>` : ""}
        <span class="mini-acts"><button data-h="${h.id}" data-a="allow">Allow</button><button data-h="${h.id}" data-a="hide" class="x">Hide</button><button data-h="${h.id}" data-a="time">Timeout 10m</button></span>
      </div>`).join("") : `<p class="sample-note">Nothing held. Rooms are calm.</p>`}</div>
    ${legendHTML()}`;
  v.querySelectorAll("[data-watch]").forEach(b => b.onclick = () => openRoom(rooms.find(r => r.id === b.dataset.watch)));
  v.querySelectorAll("[data-h]").forEach(b => b.onclick = () => {
    const h = held.find(x => x.id === b.dataset.h), room = rooms.find(r => r.id === h.room).title;
    const words = { allow: `Allowed a held message from ${h.who} in ${room}`, hide: `Hid a message from ${h.who} in ${room}`, time: `Timed out ${h.who} for 10 minutes in ${room}` };
    addLog(words[b.dataset.a]); held.splice(held.indexOf(h), 1);
    toast({ allow: "Message posted.", hide: "Message hidden.", time: `${h.who} timed out.` }[b.dataset.a]);
    renderModLive();
  });
}

// ---------- MOD: log ----------
function renderLog() {
  $("#view-log").innerHTML = `
    <div class="section-head"><h2>Action log</h2><span>Tonight</span></div>
    <div>${log.map(l => `<div class="log-row"><time>${esc(l.t)}</time><div><b>${esc(l.who)}</b> ${esc(l.what)}${l.ref ? `<small>${esc(l.ref)}</small>` : ""}</div></div>`).join("")}</div>
    <p class="sample-note">Every action is logged so a second mod can review it. Members can appeal any decision.</p>`;
}

// ---------- MOD: team & policy ----------
function renderTeam() {
  $("#view-team").innerHTML = `
    <div class="section-head"><h2>Tonight's team</h2><span>${mods.filter(m => m.on).length} on shift</span></div>
    <div class="panel roster">${mods.map(m => `<div class="mod-row">${avatar(m)}<div class="txt"><b>${esc(m.name)}</b><small>${esc(m.role)} · ${esc(m.shift)}</small></div>
      <span class="onshift ${m.on ? "" : "off"}">${m.on ? "On shift" : "Off"}</span></div>`).join("")}</div>

    <div class="panel"><h3>A friendship space</h3>
      <p style="margin:0;font-size:14px">Anything that turns a friendship space into a pickup space gets edited or removed.</p>
      <div class="twocol">
        <div class="no"><h4>Take action</h4><ul><li>Asking someone out or "just the two of us" invites</li><li>Flirting, romantic compliments, winky emoji at someone</li><li>"Single" or "more than friends" in a profile</li><li>Hookup talk of any kind</li></ul></div>
        <div class="yes"><h4>This is fine</h4><ul><li>"Love your jacket" or "your stream is so cozy"</li><li>Talking about your own partner</li><li>Group plans and carpools</li><li>Members sharing their own news, including medical</li></ul></div>
      </div></div>

    <div class="panel"><h3>Enforcement ladder</h3>
      <ol class="ladder">
        <li>First strike: edit or hide the content and send a warning.</li>
        <li>Second strike: mute for 7 days.</li>
        <li>Third strike: remove from Twine.</li>
      </ol>
      <p class="sample-note" style="margin:0">Fetishizing, threats, and outing someone skip the ladder: remove on the first strike, and tell the lead mod.</p></div>

    <div class="panel"><h3>What the highlights mean</h3>
      ${Object.entries(FLAG_CATS).filter(([k]) => k !== "other").map(([k, f]) => `<div style="font-size:14px"><mark class="hl hl-${k}">${f.label}</mark> <span style="color:var(--muted)">· pledge rule ${f.rule}</span></div>`).join("")}
      <p class="sample-note" style="margin:0">Highlights are hints. "Surgery" in a member's own update is fine. "Are you pre-op?" aimed at someone isn't.</p></div>`;
}

// ---------- shared UI ----------
function sheet(title, html, flush) {
  const s = document.createElement("div");
  s.className = "sheet"; s.setAttribute("role", "dialog"); s.setAttribute("aria-label", title.replace(/<[^>]+>/g, ""));
  s.innerHTML = `<div class="sheet-head"><button class="icon-btn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button><h2>${title}</h2></div><div class="sheet-body">${html}</div>`;
  s.querySelector(".icon-btn").onclick = () => s.remove();
  $("#app").appendChild(s);
  return s;
}
function toast(msg) {
  document.querySelector(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  $("#app").appendChild(t); setTimeout(() => t.remove(), 2600);
}

const ICON = {
  meet: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="3" width="12" height="16" rx="3" transform="rotate(-8 11 11)"/><path d="M9 21h9a3 3 0 0 0 3-3V8"/></svg>`,
  nearby: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>`,
  live: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="2" y="5" width="15" height="14" rx="3"/><path d="M17 10l5-3v10l-5-3z"/></svg>`,
  events: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`,
  chats: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>`,
  queue: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5 5h14l2 8v6H3v-6z"/></svg>`,
  log: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>`,
  team: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>`,
};
const NAVS = {
  member: [["meet", "Meet"], ["nearby", "Nearby"], ["live", "Live", () => rooms.length], ["events", "Events"], ["chats", "Chats"]],
  mod: [["queue", "Queue", () => openCases().length], ["modlive", "Live", () => held.length], ["log", "Log"], ["team", "Team"]],
};
const ICON_FOR = { modlive: "live" };
function renderNav() {
  const items = NAVS[state.mode], nav = $("#tabs");
  nav.style.gridTemplateColumns = `repeat(${items.length}, 1fr)`;
  nav.innerHTML = items.map(([v, l, badge]) => {
    const n = badge ? badge() : 0;
    return `<button role="tab" id="tab-${v}" data-view="${v}" aria-selected="${v === state.view}">${ICON[ICON_FOR[v] || v]}${l}${n ? `<span class="badge">${n}</span>` : ""}</button>`;
  }).join("");
  nav.querySelectorAll("button").forEach(b => b.onclick = () => show(b.dataset.view));
}

const RENDER = { meet: renderMeet, nearby: renderNearby, live: renderLive, events: renderEvents, chats: renderChats,
  queue: renderQueue, modlive: renderModLive, log: renderLog, team: renderTeam };
function show(view) {
  state.view = view;
  renderNav();
  document.querySelectorAll("main .view").forEach(s => s.hidden = s.id !== "view-" + view);
  document.querySelectorAll(".sheet").forEach(s => s.remove());
  RENDER[view](); $("#main").scrollTop = 0;
}
function setMode(mode) {
  state.mode = mode; clearInterval(roomTimer);
  $("#app").classList.toggle("mod", mode === "mod");
  $("#modpill").hidden = mode !== "mod";
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === mode));
  show(mode === "mod" ? "queue" : "meet");
}
document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => setMode(b.dataset.mode));

// ---------- feedback (opens a pre-filled GitHub issue form) ----------
const FEEDBACK_REPO = "https://github.com/EngineeringMoonBear/twine/issues/new";
// The relay files the issue for people without GitHub. Artifacts can't call outside services, so only the hosted site uses it.
const RELAY_URL = "";
const canRelay = () => !!RELAY_URL && location.hostname === "twine.joshedunbar.com";
const FB_KINDS = ["Idea", "Confusing", "Bug", "Love it", "Missing"];
const VIEW_NAMES = { meet: "Meet", nearby: "Nearby", live: "Live", events: "Events", chats: "Chats",
  queue: "Mod › Queue", modlive: "Mod › Live", log: "Mod › Log", team: "Mod › Team" };

// Where the reviewer is right now: the tab, plus whatever sheet is open on top of it.
function feedbackContext() {
  const tab = VIEW_NAMES[state.view];
  const top = [...document.querySelectorAll(".sheet:not(.fb-sheet)")].pop()?.getAttribute("aria-label");
  const screen = document.querySelector(".match") ? `${tab} › New friend` : top ? `${tab} › ${top}` : tab;
  const details = [
    `Platform: web prototype`,
    `Mode: ${state.mode === "mod" ? "Mod team" : "Member"}`,
    `Viewport: ${innerWidth}×${innerHeight}`,
    `Device: ${navigator.userAgent}`,
    `Page: ${location.host || "claude.ai artifact"}`,
  ].join("\n");
  return { screen, details };
}

function openFeedback() {
  const { screen, details } = feedbackContext();
  const relay = canRelay();
  let kind = "Idea";
  const s = sheet("Feedback", `
    <p style="margin:0">Tell Josh what you think about this screen, or the app as a whole.</p>
    <div class="fb-kinds" role="group" aria-label="Kind of feedback">${FB_KINDS.map(k => `<button id="fb-kind-${k.replace(/\s/g, "")}" data-k="${k}" aria-pressed="${k === kind}">${k}</button>`).join("")}</div>
    <div class="field"><label for="fb-screen">Screen</label><input id="fb-screen" value="${esc(screen)}"></div>
    <div class="field"><label for="fb-note">Your feedback</label><textarea id="fb-note" rows="5" placeholder="What did you like, what confused you, what's missing?"></textarea></div>
    ${relay ? `<div class="field"><label for="fb-name">Your name (optional)</label><input id="fb-name" autocomplete="given-name" placeholder="So Josh knows who to thank"></div>` : ""}
    <div class="fb-hp" aria-hidden="true"><label for="fb-website">Website</label><input id="fb-website" tabindex="-1" autocomplete="off"></div>
    <div class="fb-context" aria-label="Details sent with your note">${esc(details)}</div>
    <div class="fb-send">
      ${relay ? `<button class="btn rose" id="fb-relay" disabled>Send feedback</button>` : ""}
      <a class="btn ${relay ? "ghost" : "rose"}" id="fb-send" target="_blank" rel="noopener" aria-disabled="true">${relay ? "Have GitHub? Send it there" : "Send on GitHub"}</a>
      <button class="btn ghost" id="fb-copy" disabled>${relay ? "Copy my note" : "No GitHub? Copy my note"}</button>
    </div>
    <p class="sample-note" style="margin:0">${relay ? "No account needed. Your note and the details above go straight to Josh." : "GitHub opens your note so you can check it before sending. Without an account, copy it and text it to Josh."}</p>`);
  s.classList.add("fb-sheet");
  const note = s.querySelector("#fb-note"), scr = s.querySelector("#fb-screen"), send = s.querySelector("#fb-send"), copy = s.querySelector("#fb-copy");
  const relayBtn = s.querySelector("#fb-relay");
  const title = () => {
    const firstLine = note.value.trim().split("\n")[0].slice(0, 60);
    return `[${kind}] ${scr.value}${firstLine ? ": " + firstLine : ""}`;
  };
  const update = () => {
    const q = new URLSearchParams({ template: "feedback.yml", title: title(), note: note.value.trim(), screen: scr.value, context: details });
    send.href = `${FEEDBACK_REPO}?${q}`;
    send.setAttribute("aria-disabled", String(!note.value.trim()));
    copy.disabled = !note.value.trim();
    if (relayBtn) relayBtn.disabled = !note.value.trim();
  };
  s.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
    kind = b.dataset.k; s.querySelectorAll("[data-k]").forEach(x => x.setAttribute("aria-pressed", x === b)); update();
  });
  note.oninput = scr.oninput = update;
  send.onclick = () => setTimeout(() => { s.remove(); toast("Thanks! Finish sending it on GitHub."); }, 300);
  copy.onclick = () => {
    const text = `Twine feedback ${title()}\n\n${note.value.trim()}\n\nScreen: ${scr.value}\n${details}`;
    const fallback = () => { note.value = text; note.select(); toast("Selected. Copy it and text it to Josh."); };
    navigator.clipboard?.writeText(text).then(() => toast("Copied. Paste it into a text to Josh."), fallback) ?? fallback();
  };
  if (relayBtn) relayBtn.onclick = async () => {
    relayBtn.disabled = true; relayBtn.textContent = "Sending…";
    try {
      const res = await fetch(RELAY_URL, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kind, screen: scr.value, note: note.value.trim(), context: details,
          name: s.querySelector("#fb-name").value, website: s.querySelector("#fb-website").value }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Couldn't send it right now. Use Copy instead.");
      s.remove(); toast("Sent! Thanks for helping shape Twine 💛");
    } catch (err) {
      toast(err.message.startsWith("Failed to fetch") ? "No connection. Use Copy instead." : err.message);
      relayBtn.textContent = "Try again"; relayBtn.disabled = false;
    }
  };
  update(); note.focus();
}
$("#fb-open").onclick = openFeedback;

// ---------- pledge gate ----------
function pledge() {
  const s = sheet("Before you join", `
    <span class="mono" style="color:var(--rose)">The Twine pledge</span>
    <h2 class="big">Two strands, one thread.</h2>
    <p>Twine is where cis women and trans women meet as friends and allies. Everyone here agrees to the same few things.</p>
    <ol>${RULES.map(r => `<li>${esc(r)}</li>`).join("")}</ol>
    <label class="check"><input type="checkbox" id="pledge-ok"> I agree, and I understand breaking these gets me removed.</label>
    <button class="btn rose" id="pledge-go" disabled>Join Twine</button>
    <p class="sample-note">Prototype: everyone shown is fictional sample data. Switch to Mod team at the top to see the moderation tools.</p>`);
  s.classList.add("pledge");
  s.querySelector(".icon-btn").remove();
  const ok = s.querySelector("#pledge-ok"), go = s.querySelector("#pledge-go");
  ok.onchange = () => go.disabled = !ok.checked;
  go.onclick = () => { s.remove(); toast("Welcome to Twine 💛"); };
}

show("meet");
pledge();
</script>
